<text x="40" y="478" class="label" text-anchor="start">time to first token, 20b / 120b</text>
<rect x="440" y="456" width="130" height="34" fill="var(--best)"/>
<text x="410" y="478" class="num" text-anchor="end">9.6 / 14.6 s</text>
<text x="560" y="478" class="numb" text-anchor="end">6.1 / 9.0 s</text>
<rect x="610" y="462" width="115" height="23" rx="11.5" fill="var(--loss-bg)"/>
<text x="618" y="478" class="pill" style="fill:var(--loss-ink)">▼ 1.6x slower</text>
<line x1="28" x2="872" y1="496" y2="496" stroke="var(--border)"/>
<text x="28" y="522" class="group" text-anchor="start">Online serving, 200 chat + coding requests</text>
<text x="872" y="522" class="unit" text-anchor="end">output tok/s</text>
<text x="40" y="558" class="label" text-anchor="start">gpt-oss-20b, all sent at once</text>
<rect x="290" y="536" width="130" height="34" fill="var(--best)"/>
