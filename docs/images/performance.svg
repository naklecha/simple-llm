<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="923" viewBox="0 0 1640 923" role="img" aria-label="SimpleLLM vs vLLM 0.31.0 on one H100: faster at decode in every batch and context tested, slower at time to first token, 120b saturated serving and 1,000-way concurrency; accuracy matches OpenAI.">
<style>
  svg { --bg:#fcfcfb; --table:#ffffff; --head:#f5f4f1; --line:#e4e3df; --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a8984; --num:#6b6a65; --best-bg:rgba(42,120,214,0.13); --win:#0a7a0a; --loss:#b42828; --tie:#6b6a65; }
  @media (prefers-color-scheme: dark) { svg { --bg:#121211; --table:#191918; --head:#1f1f1d; --line:#34342f; --ink:#ffffff; --ink2:#c3c2b7; --ink3:#8f8e86; --num:#a9a89f; --best-bg:rgba(85,152,231,0.22); --win:#6fd46f; --loss:#f08b8b; --tie:#a9a89f; } }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .title { font-size: 40px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { font-size: 18px; fill: var(--ink3); }
  .group { font-size: 21px; font-weight: 700; }
  .unit { font-size: 15px; font-weight: 400; fill: var(--ink3); }
  .colh { font-size: 13px; font-weight: 650; letter-spacing: .06em; fill: var(--ink3); }
  .label { font-size: 17px; fill: var(--ink2); }
  .num { font-size: 19px; font-variant-numeric: tabular-nums; fill: var(--num); }
  .best { fill: var(--ink); font-weight: 700; }
  .delta { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .foot { font-size: 15px; fill: var(--ink3); }
</style>
<rect width="1640" height="923" rx="12" fill="var(--bg)"/>
<text x="48" y="74" class="title" text-anchor="start">SimpleLLM vs vLLM 0.31.0</text>
<text x="48" y="110" class="sub" text-anchor="start">gpt-oss-20b and gpt-oss-120b on one H100 80GB · official MXFP4 weights · greedy decoding · median of 3 runs</text>
<text x="48" y="178" class="group">Decode<tspan class="unit" dx="12">1,000 output tokens, tok/s</tspan></text>
