<text x="560" y="262" class="num" text-anchor="end">4,270</text>
<rect x="610" y="246" width="77" height="23" rx="11.5" fill="var(--win-bg)"/>
<text x="618" y="262" class="pill" style="fill:var(--win-ink)">▲ +12.0%</text>
<line x1="28" x2="872" y1="280" y2="280" stroke="var(--border)"/>
<text x="28" y="306" class="group" text-anchor="start">Max context, 122k-token prompts, 8,192 output tokens</text>
<text x="872" y="306" class="unit" text-anchor="end">output tok/s</text>
<text x="40" y="342" class="label" text-anchor="start">gpt-oss-20b, batch 1</text>
<rect x="290" y="320" width="130" height="34" fill="var(--best)"/>
<text x="410" y="342" class="numb" text-anchor="end">266</text>
<text x="560" y="342" class="num" text-anchor="end">229</text>
<rect x="610" y="326" width="77" height="23" rx="11.5" fill="var(--win-bg)"/>
<text x="618" y="342" class="pill" style="fill:var(--win-ink)">▲ +16.2%</text>
<text x="40" y="376" class="label" text-anchor="start">gpt-oss-20b, batch 14</text>
<rect x="290" y="354" width="130" height="34" fill="var(--best)"/>
<text x="410" y="376" class="numb" text-anchor="end">709</text>
<text x="560" y="376" class="num" text-anchor="end">671</text>
