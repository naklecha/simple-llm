<text x="560" y="558" class="num" text-anchor="end">3,190</text>
<rect x="610" y="542" width="77" height="23" rx="11.5" fill="var(--win-bg)"/>
<text x="618" y="558" class="pill" style="fill:var(--win-ink)">▲ +14.9%</text>
<text x="40" y="592" class="label" text-anchor="start">gpt-oss-120b, all sent at once</text>
<rect x="440" y="570" width="130" height="34" fill="var(--best)"/>
