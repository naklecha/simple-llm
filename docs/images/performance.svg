<text x="410" y="626" class="num" text-anchor="end">582 to 1,327</text>
<text x="560" y="626" class="num" text-anchor="end">577 to 1,291</text>
<rect x="610" y="610" width="122" height="23" rx="11.5" fill="var(--tie-bg)"/>
<text x="618" y="626" class="pill" style="fill:var(--tie-ink)">= tie to +2.1%</text>
<line x1="28" x2="872" y1="644" y2="644" stroke="var(--border)"/>
<text x="28" y="670" class="group" text-anchor="start">1,000 requests at once, gpt-oss-20b</text>
<text x="872" y="670" class="unit" text-anchor="end">output tok/s</text>
<text x="40" y="706" class="label" text-anchor="start">same concurrency (64)</text>
<rect x="290" y="684" width="130" height="34" fill="var(--best)"/>
<text x="410" y="706" class="numb" text-anchor="end">7,309</text>
<text x="560" y="706" class="num" text-anchor="end">5,923</text>
<rect x="610" y="690" width="77" height="23" rx="11.5" fill="var(--win-bg)"/>
<text x="618" y="706" class="pill" style="fill:var(--win-ink)">▲ +23.4%</text>
<text x="40" y="740" class="label" text-anchor="start">each at its max (256 vs 1,024)</text>
<rect x="440" y="718" width="130" height="34" fill="var(--best)"/>
<text x="410" y="740" class="num" text-anchor="end">12,682</text>
<text x="560" y="740" class="numb" text-anchor="end">22,482</text>
<rect x="610" y="724" width="77" height="23" rx="11.5" fill="var(--loss-bg)"/>
<text x="618" y="740" class="pill" style="fill:var(--loss-ink)">▼ −43.6%</text>
<line x1="28" x2="872" y1="758" y2="758" stroke="var(--border)"/>
<text x="28" y="784" class="group" text-anchor="start">Accuracy, low reasoning effort</text>
<text x="872" y="784" class="unit" text-anchor="end">OpenAI published in brackets</text>
<text x="40" y="820" class="label" text-anchor="start">gpt-oss-20b, GPQA / AIME 2025</text>
<text x="410" y="820" class="num" text-anchor="end">56.3 / 36.3%</text>
<text x="560" y="820" class="num" text-anchor="end">56.8 / 37.9%</text>
<rect x="610" y="804" width="191" height="23" rx="11.5" fill="var(--win-bg)"/>
