<text x="40" y="444" class="label" text-anchor="start">gpt-oss-120b, batch 2</text>
<rect x="290" y="422" width="130" height="34" fill="var(--best)"/>
<text x="410" y="444" class="numb" text-anchor="end">268</text>
<text x="560" y="444" class="num" text-anchor="end">237</text>
<rect x="610" y="428" width="77" height="23" rx="11.5" fill="var(--win-bg)"/>
