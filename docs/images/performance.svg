<svg xmlns="http://www.w3.org/2000/svg" width="900" height="916" viewBox="0 0 900 916" role="img" aria-label="SimpleLLM vs tuned vLLM 0.31.0 on one H100: faster at decode in every batch and context tested, slower at time to first token, 120b saturated serving and 1,000-way concurrency; accuracy matches OpenAI.">
<style>
  svg { --bg:#fcfcfb; --border:#e4e3df; --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a8984; --rule:#efeeea; --band:#f5f4f1;
        --win-bg:#e3f4e3; --win-ink:#0a6b0a; --loss-bg:#fbe5e5; --loss-ink:#a82828; --tie-bg:#efeeea; --tie-ink:#52514e;
        --us:#2a78d6; --best:rgba(42,120,214,0.09); }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#1a1a19; --border:#33332f; --ink:#ffffff; --ink2:#c3c2b7; --ink3:#8f8e86; --rule:#2a2a27; --band:#222220;
          --win-bg:#173a17; --win-ink:#7fd67f; --loss-bg:#432020; --loss-ink:#f19a9a; --tie-bg:#2e2e2b; --tie-ink:#c3c2b7;
          --us:#5598e7; --best:rgba(85,152,231,0.16); }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .title { font-size: 20px; font-weight: 650; }
  .sub { font-size: 13px; fill: var(--ink2); }
  .colh { font-size: 12px; font-weight: 600; fill: var(--ink2); letter-spacing: .04em; text-transform: uppercase; }
  .us { fill: var(--us); }
  .group { font-size: 14px; font-weight: 650; }
  .unit { font-size: 12px; fill: var(--ink3); }
  .label { font-size: 14px; fill: var(--ink2); }
  .num { font-size: 14px; font-variant-numeric: tabular-nums; }
  .numb { font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .foot { font-size: 12px; fill: var(--ink3); }
  .pill { font-size: 13px; font-weight: 650; }
</style>
<rect x="0.5" y="0.5" width="899" height="915" rx="12" fill="var(--bg)" stroke="var(--border)"/>
<text x="28" y="40" class="title" text-anchor="start">SimpleLLM vs tuned vLLM 0.31.0</text>
<text x="28" y="62" class="sub" text-anchor="start">One NVIDIA H100 80GB, official MXFP4 checkpoints, greedy decoding, median of 3 runs in separate processes</text>
<text x="410" y="86" class="colh us" text-anchor="end">SimpleLLM</text>
<text x="560" y="86" class="colh" text-anchor="end">vLLM</text>
<text x="610" y="86" class="colh" text-anchor="start">Difference</text>
<line x1="28" x2="872" y1="98" y2="98" stroke="var(--border)"/>
<text x="28" y="124" class="group" text-anchor="start">Decode, 1,000 output tokens</text>
<text x="872" y="124" class="unit" text-anchor="end">output tok/s</text>
<text x="40" y="160" class="label" text-anchor="start">gpt-oss-20b, batch 1</text>
<rect x="290" y="138" width="130" height="34" fill="var(--best)"/>
<text x="410" y="160" class="numb" text-anchor="end">381</text>
<text x="560" y="160" class="num" text-anchor="end">331</text>
<rect x="610" y="144" width="77" height="23" rx="11.5" fill="var(--win-bg)"/>
<text x="618" y="160" class="pill" style="fill:var(--win-ink)">▲ +15.2%</text>
<text x="40" y="194" class="label" text-anchor="start">gpt-oss-20b, batch 64</text>
<rect x="290" y="172" width="130" height="34" fill="var(--best)"/>
<text x="410" y="194" class="numb" text-anchor="end">9,844</text>
<text x="560" y="194" class="num" text-anchor="end">8,881</text>
<rect x="610" y="178" width="77" height="23" rx="11.5" fill="var(--win-bg)"/>
<text x="618" y="194" class="pill" style="fill:var(--win-ink)">▲ +10.8%</text>
<text x="40" y="228" class="label" text-anchor="start">gpt-oss-120b, batch 1</text>
<rect x="290" y="206" width="130" height="34" fill="var(--best)"/>
<text x="410" y="228" class="numb" text-anchor="end">268</text>
<text x="560" y="228" class="num" text-anchor="end">233</text>
<rect x="610" y="212" width="77" height="23" rx="11.5" fill="var(--win-bg)"/>
<text x="618" y="228" class="pill" style="fill:var(--win-ink)">▲ +14.9%</text>
